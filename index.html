<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#0e0e0e;
    padding:10px;
}

/* GRID MOBILE FIRST */
.gallery{
    display:grid;
    grid-template-columns: 1fr;
    gap:15px;
    max-width:900px;
    margin:0 auto;
}

/* TABLET */
@media(min-width:600px){
    .gallery{
        grid-template-columns: repeat(2, 1fr);
    }
}

/* PC */
@media(min-width:1000px){
    .gallery{
        grid-template-columns: repeat(3, 1fr);
    }
}

/* IMMAGINI GRANDI */
.gallery img{
    width:100%;
    height:260px;
    object-fit:cover;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.6);
    transition:0.25s;
    border:2px solid rgba(255,255,255,0.05);
}

/* effet clic/hover */
.gallery img:active{
    transform:scale(0.97);
}

.gallery img:hover{
    transform:scale(1.03);
}

/* BOTTONI */
.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:15px 0 20px;
    flex-wrap:wrap;
}

button{
    padding:14px 18px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    background:#ffb703;
    color:#111;
}

button:active{
    transform:scale(0.96);
}

button:nth-child(2){
    background:#e63946;
    color:white;
}

/* PRINT */
@media print{
    body{
        background:white;
    }
    .buttons{
        display:none;
    }
    .gallery img{
        box-shadow:none;
        border:none;
    }
}
</style>

</head>

<body>

<div class="buttons">
    <button onclick="window.print()">Stampa</button>
    <button onclick="alert('Ordine inviato')">Ordina</button>
</div>

<div class="gallery">

    <img src="img1.png" alt="">
    <img src="img2.png" alt="">
    <img src="img3.png" alt="">
    <img src="img4.png" alt="">
    <img src="img5.png" alt="">
    <img src="img6.png" alt="">

</div>

</body>
</html>
