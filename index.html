<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
    padding:30px 15px;
}

/* GRID */
.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap:20px;
    max-width:1100px;
    margin:0 auto;
}

/* IMMAGINI */
.gallery img{
    width:100%;
    height:240px;
    object-fit:cover;
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,0.6);
    transition:0.3s ease;
    border:1px solid rgba(255,255,255,0.08);
}

.gallery img:hover{
    transform: scale(1.05);
    box-shadow:0 18px 40px rgba(0,0,0,0.8);
}

/* BOTTONI */
.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:25px auto;
    flex-wrap:wrap;
}

button{
    padding:12px 22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:0.3s;
    background:#f4a261;
    color:#111;
}

button:hover{
    background:#e76f51;
}

/* STAMPA */
@media print{
    body{
        background:white;
    }
    button, .buttons{
        display:none;
    }
    .gallery img{
        box-shadow:none;
        border:none;
    }
}
</style>

</head>

<body>

<div class="buttons">
    <button onclick="window.print()">Stampa</button>
    <button onclick="alert('Ordine inviato')">Ordina</button>
</div>

<div class="gallery">

    <img src="img1.png" alt="">
    <img src="img2.png" alt="">
    <img src="img3.png" alt="">
    <img src="img4.png" alt="">
    <img src="img5.png" alt="">
    <img src="img6.png" alt="">

</div>

</body>
</html>
