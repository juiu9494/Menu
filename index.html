<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(135deg, #111, #222);
    padding:30px 15px;
    color:white;
}

/* TITRE MENU */
h1{
    text-align:center;
    font-size:40px;
    margin-bottom:20px;
    letter-spacing:2px;
}

/* SOUS TITRE */
.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:30px;
}

/* GRID MENU */
.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap:20px;
    max-width:1100px;
    margin:0 auto;
}

/* CARTE MENU */
.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border:2px solid rgba(255,255,255,0.1);
}

.gallery img:hover{
    transform: scale(1.05);
    box-shadow:0 15px 35px rgba(0,0,0,0.7);
}

/* BOUTONS */
.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:30px auto;
    flex-wrap:wrap;
}

button{
    padding:12px 22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:0.3s;
}

/* bouton normal */
button{
    background:#ffb703;
    color:#111;
}

button:hover{
    background:#ff8800;
}

/* bouton print */
.print-btn{
    background:#e63946;
    color:white;
}

.print-btn:hover{
    background:#c1121f;
}

/* LABEL SUR IMAGE (MENU STYLE) */
.item{
    position:relative;
}

.item span{
    position:absolute;
    bottom:10px;
    left:10px;
    background:rgba(0,0,0,0.7);
    padding:5px 10px;
    border-radius:8px;
    font-size:14px;
}

/* PRINT MODE */
@media print{
    body{
        background:white;
        color:black;
    }
    button, .buttons{
        display:none;
    }
    .gallery img{
        box-shadow:none;
        border:none;
    }
}
</style>

</head>

<body>

<h1>🍽 MENU</h1>
<div class="subtitle">Clique sur une image pour voir le plat</div>

<div class="buttons">
    <button onclick="window.print()">🖨 Imprimer</button>
    <button class="print-btn" onclick="alert('Menu envoyé !')">📩 Commander</button>
</div>

<div class="gallery">

    <div class="item">
        <img src="img1.png">
        <span>Plat 1</span>
    </div>

    <div class="item">
        <img src="img2.png">
        <span>Plat 2</span>
    </div>

    <div class="item">
        <img src="img3.png">
        <span>Plat 3</span>
    </div>

    <div class="item">
        <img src="img4.png">
        <span>Plat 4</span>
    </div>

    <div class="item">
        <img src="img5.png">
        <span>Plat 5</span>
    </div>

    <div class="item">
        <img src="img6.png">
        <span>Plat 6</span>
    </div>

</div>

</body>
</html>
